[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "polymarket-terminal"
version = "3.1.0"
description = "Bloomberg-style Polymarket terminal powered by the Polymarket CLI"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
pm-terminal = "polymarket_terminal:main"
